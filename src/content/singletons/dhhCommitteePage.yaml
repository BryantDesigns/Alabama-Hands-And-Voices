heroTagline: Deaf & Hard of Hearing Role Models & Mentors
committeeCardBody: Deaf or Hard of Hearing Committee Members can…
benefits:
  - benefit: Provide exposure to a variety of communication modes and methods to families with children who are deaf or hard of hearing.
  - benefit: Increase awareness of and sensitivity to issues faced by individuals who are deaf or hard of hearing.
  - benefit: Share information through personal experiences.
  - benefit: Create a safe place in which children, parents and professionals can ask questions about hearing loss.
  - benefit: Provide input to families seeking a better understanding of hearing loss
