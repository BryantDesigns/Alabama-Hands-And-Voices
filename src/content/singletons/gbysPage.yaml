heroTagline: A parent guide, right by your side
services:
    - service: Connection to resources locally, statewide, and nationally specific to hearing loss
    - service: Regional social events, connection to other families or deaf/hh adults, training and workshops
    - service: Guides specifically for Spanish-speaking families, and/or families with unilateral hearing loss, deaf plus, and more
    - service: Advocacy for families through Early Intervention, transition to school systems, IFSP and IEP development, Special Education law information and training, navigating the education maze.
    - service: Direct parent support from an experienced parent who can support you in understanding your child’s unique needs specific to your family journey
enrollmentNote: >-
    Through the support of generous donors, we are able to offer this program free of charge. Enrollment in the program can be anytime from the moment you learn your child has a hearing loss or later in life.
