heroTagline: Helping families protect children who are deaf or hard of hearing.
actionCards:
  - title: Pass-It-On
    description: >-
      Share the articles on our Hands & Voices website and its related resources, with at least one other parent, and then ask them to “pass-it-on.”
  - title: Share the Story
    description: >-
      Have a conversation with your child about abuse and neglect (see attached “Helping Parents Talk to Children” below) then share the story of how it went so that other parents can learn from your experience.
  - title: Recognize the Best and Challenge Everyone Else
    description: >-
      Ask the professionals who work with your child what they are doing to protect your child from abuse and neglect, then share the resulting reactions, information, resources, programs, and questions so that we recognize the best and challenge everyone else.
familyRetreatsHeading: Family Retreats
familyRetreatsBody: >-
  Alabama H&V hosts two family retreats a year. Retreats allow for in-person support of families by providing parent sessions on topics related to raising a child who is deaf or hard of hearing and an opportunity for families to build bonds with their parent guide and with each other. Contact your parent guide or connect with one today for more information on registration for our
familyRetreatsLink: /programs/gbys
