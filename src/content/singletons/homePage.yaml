learnMore:
  heading: Learn More About Us
  featureBlocks:
    - heading: Guide By Your Side
      body: >-
        The Alabama Hands & Voices Guide By Your Side program is dedicated to directly supporting families and their children who have been diagnosed with a hearing loss, by offering families the opportunity to talk or meet, face-to-face, with a trained Parent Guide.
      image: /images/aboutUsWhoWeAreFamily.jpg
      imageAlt: GBYS family support
    - heading: Educational Advocacy
      body: >-
        ASTra is an educational advocacy program that embodies the mission and vision of Hands & Voices. ASTra stands for the Advocacy Support and Training Program.
      image: /images/aboutUsWhoWeAreTrail.jpeg
      imageAlt: Educational advocacy support
membership:
  heading: Membership
  body: >-
    Thank you for your interest in Alabama Hands & Voices. Please consider joining our chapter. Membership fees help fund our chapter activities and operations and provide members with newsletters from Hands & Voices headquarters. Yearly membership fees are $25 for families, students, and deaf or hard of hearing adults, $40 for professionals, and $50 for organizations.
