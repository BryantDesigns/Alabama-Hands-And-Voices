whoWeAreQuote: >-
    There is room in the community of deafness for an organization like Hands & Voices, and in fact, I think parents, and many professionals, have been crying out for a group like this. Somehow parents connecting to other parents provides an element of credibility; there's a level of 'knowing & feeling' that only a parent experiences. And parents, especially parents of babies newly identified with deafness or hearing loss, need a way to connect like this without being wary of a sponsoring agenda from a service provider.
whoWeAreQuoteAttribution: Leeanne Seaver, Hands & Voices
values:
    - value: We all want the best for our children who are deaf or hard of hearing.
    - value: We deserve respect and honor for our role as parents/families. We require a beneficial, successful educational experience for our kids.
    - value: We need information from a wide variety of sources.
    - value: We want to know about opportunities and resources.
    - value: We need training and support to become effective advocates for our kids.
    - value: We are stronger united by our common interests than divided by differing communication choices.
    - value: We must lend our organized support to all kinds of efforts that promote our common interests - strength in numbers!
membershipCtaText: |-
    Whether you're signing up for the first time or renewing your membership to Alabama Hands & Voices, please take time now to download the membership form or visit our online membership page. Your contribution helps us to continue developing and disseminating resources designed to give families unbiased information for their children who are deaf or hard-of-hearing. We are grateful for your support. Thank you!

    Scholarships are available for parents upon request.
