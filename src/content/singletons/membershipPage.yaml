heroHeading: Help Us Help You!
heroText: >-
    We are a non-profit organization dedicated to supporting families of children who are deaf or hard of hearing with information and resources so they can make the best choices for their child. Your contribution helps us to continue developing and disseminating resources designed to give families unbiased information for their children who are deaf or hard-of-hearing. We are grateful for your support. Thank you!
