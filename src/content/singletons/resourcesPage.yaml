ehdiSidebarBody: >-
    The EHDI-PALS directory has information about hearing (audiology) services for children from birth to age five. All of the facilities in this directory report that they have the equipment and expertise to serve children and have licensed audiologists. The directory contains clinic information, including: audiology (hearing) services, languages available, payment options, appointment availability. To learn more about childhood hearing loss and to find a pediatric audiologist, visit:
ehdiSidebarUrl: http://www.ehdi-pals.org/
